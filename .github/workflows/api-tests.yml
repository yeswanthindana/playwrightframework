name: API Tests

on:
    push:
        branches: [main, pw-yesh]
    pull_request:
        branches: [main, pw-yesh]

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Run Playwright API tests
              run: npx playwright test tests/api/
